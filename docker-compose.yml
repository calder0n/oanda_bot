services:
  oanda-bot:
    build: .
    image: oanda-bot:latest
    container_name: oanda-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - CONFIG_PATH=/app/config/accounts.yaml
      - STATE_DIR=/app/state
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ./config:/app/config:ro
      - ./logs:/app/logs
      - ./state:/app/state
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
