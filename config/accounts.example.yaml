# Multi-account configuration.
# Duplicate a block to add another OANDA account. Everything under `strategy`
# can be overridden per account. Tokens here MUST be demo (practice) tokens
# until the strategy has been incubated - see README.
#
# Defaults below are tuned for a $1,000 USD starting balance:
#   - 1% risk per trade = ~$10 risked
#   - max 3 concurrent positions so total at-risk capital stays around $30
#   - hard daily-loss kill switch at 3% = ~$30
#   - FX majors + metals + some indices (many instruments are filtered out
#     automatically because their min trade size * stop distance exceeds $10)

defaults:
  environment: practice           # practice | live
  granularity: M15                # candle size (M1, M5, M15, H1, etc.)
  tick_interval_seconds: 30       # how often each worker polls OANDA
  instruments: "ALL_TRADEABLE"    # "ALL_TRADEABLE" or explicit list below
  excluded_instruments: []        # e.g. ["XAU_XAG", "USB10Y_USD"]
  initial_capital_usd: 1000       # reference only; sizing uses live NAV
  log_evaluations: true           # emit per-instrument numbers each tick
  notifications:
    telegram:
      enabled: false              # set to true after filling bot_token + chat_id
      bot_token: "PUT_TELEGRAM_BOT_TOKEN_HERE"
      chat_id:   "PUT_TELEGRAM_CHAT_ID_HERE"
      notify_on:                  # events that trigger a message
        - order_filled
  strategy:
    name: kevin_davey_breakout
    params:
      lookback_bars: 40           # Donchian-style breakout window
      atr_period: 14
      atr_stop_mult: 2.0          # initial stop = N * ATR
      atr_target_mult: 4.0        # profit target = N * ATR (2:1 R)
      volatility_filter_atr_pct: 0.0003  # min ATR / price ratio to trade
      time_exit_bars: 48          # flat by this many bars if no stop/target
      risk_per_trade_pct: 1.0     # % of equity risked per trade ($10 on $1k)
      max_open_positions: 3       # cap concurrent risk at ~3% equity
      max_daily_loss_pct: 3.0     # hard kill-switch per UTC day
      trading_window_utc:         # restrict trading hours (UTC)
        start: "06:00"
        end:   "20:00"

accounts:
  - name: demo-primary
    account_id: "101-001-0000000-001"
    access_token: "PUT_YOUR_DEMO_TOKEN_HERE"
