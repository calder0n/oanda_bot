# Multi-account configuration for the Fibonacci day-trading bot.
# Duplicate a block in `accounts:` to add another OANDA account. Anything
# under `strategy` (or any other section) can be overridden per account.
# Tokens here MUST be demo (practice) tokens until the strategy has been
# incubated - see README.
#
# Defaults are tuned for a $1,000 USD starting balance:
#   - 1% risk per trade  -> ~$10 risked per setup
#   - max 3 concurrent positions -> ~$30 total at-risk capital
#   - hard daily-loss kill switch at 3% -> ~$30 daily stop
#   - M5 candles for intraday Fibonacci pullbacks
#   - All practice-tradeable instruments are scanned automatically; many
#     high-priced ones (XAU_USD, indices, BTC) get auto-skipped because
#     position size falls below the broker minimum at $10 risk.

defaults:
  environment: practice           # practice | live  (KEEP practice while testing)
  granularity: M5                 # M1 / M5 / M15 / H1 - M5 is the day-trading sweet spot
  tick_interval_seconds: 20       # how often each worker polls OANDA
  instruments: "ALL_TRADEABLE"    # "ALL_TRADEABLE" or an explicit list below
  excluded_instruments: []        # e.g. ["XAU_XAG", "USB10Y_USD"]
  initial_capital_usd: 1000       # reference only; sizing uses live NAV
  log_evaluations: true           # emit per-instrument numbers each tick
  notifications:
    telegram:
      enabled: false              # set to true after filling bot_token + chat_id
      bot_token: "PUT_TELEGRAM_BOT_TOKEN_HERE"
      chat_id:   "PUT_TELEGRAM_CHAT_ID_HERE"
      notify_on:                  # events that trigger a message
        - order_filled            # every newly opened trade
        # - startup               # also message when a worker starts up
  strategy:
    name: fibonacci_day_trading
    params:
      # --- Fibonacci core ---
      swing_lookback: 30          # bars used to anchor the most recent swing
      trend_ema_period: 50        # EMA used to define intraday trend bias
      entry_zone_low: 0.382       # shallower edge of the "golden zone"
      entry_zone_high: 0.618      # deeper edge
      invalidation_fib: 0.786     # stop sits just past this retracement
      target_extension: 1.272     # take-profit Fibonacci extension
      atr_period: 14
      min_atr_pct: 0.0002         # min ATR / price to bother trading

      # --- Portfolio risk (Davey-style controls) ---
      risk_per_trade_pct: 1.0     # 1% of NAV -> ~$10 on a $1,000 account
      max_open_positions: 3       # cap simultaneous risk at ~3 * 1% = 3%
      max_daily_loss_pct: 3.0     # hard kill-switch per UTC day
      time_exit_bars: 24          # day-trading: flatten after ~2h on M5
      trading_window_utc:         # restrict trading to active intraday hours
        start: "07:00"
        end:   "20:00"

accounts:
  - name: demo-primary
    account_id: "101-001-0000000-001"
    access_token: "PUT_YOUR_DEMO_TOKEN_HERE"
