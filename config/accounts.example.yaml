# Multi-account configuration for the scalping bot.
# Duplicate a block to add another OANDA account. Everything under `strategy`
# (and any other field) can be overridden per account. Tokens here MUST be
# demo (practice) tokens.
#
# Defaults below are tuned for a $1,000 USD starting balance on 1-minute
# ADX+RSI scalping:
#   - 1% risk per trade = ~$10 risked per entry
#   - max 3 concurrent positions
#   - hard daily-loss kill switch at 3% = ~$30
#   - every practice-tradeable instrument is evaluated

defaults:
  environment: practice           # practice | live  (keep practice)
  granularity: M1                 # 1-minute candles
  tick_interval_seconds: 20       # how often each worker polls OANDA
  instruments: "ALL_TRADEABLE"    # evaluate every demo-tradeable instrument
  excluded_instruments: []
  initial_capital_usd: 1000       # reference; sizing uses live NAV
  log_evaluations: true           # emit per-instrument numbers each tick
  notifications:
    telegram:
      enabled: false              # set to true after filling bot_token + chat_id
      bot_token: "PUT_TELEGRAM_BOT_TOKEN_HERE"
      chat_id:   "PUT_TELEGRAM_CHAT_ID_HERE"
      notify_on:
        - order_filled
  strategy:
    name: scalping_adx_rsi
    params:
      adx_period: 14
      rsi_period: 14
      atr_period: 14
      adx_min: 23.0               # long/short only when ADX >= this
      rsi_oversold: 35.0          # BUY when RSI <= this AND ADX ok
      rsi_overbought: 65.0        # SELL when RSI >= this AND ADX ok
      atr_stop_mult: 1.5          # SL distance = N * ATR
      atr_target_mult: 1.5        # TP distance = N * ATR (1:1 R on scalps)
      time_exit_bars: 0           # 0 = disable time-exit; SL/TP will flatten
      risk_per_trade_pct: 1.0     # ~$10 risk on a $1k account
      max_open_positions: 3
      max_daily_loss_pct: 3.0
      trading_window_utc:
        start: "00:00"
        end:   "23:59"

accounts:
  - name: demo-primary
    account_id: "101-001-0000000-001"
    access_token: "PUT_YOUR_DEMO_TOKEN_HERE"
    # Per-account overrides go here, e.g.:
    # notifications:
